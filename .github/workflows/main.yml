name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create local.properties
        run: echo "apiKey=${{ secrets.API_KEY }}" > local.properties
      - name: Create debug keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Add dummy google-services string
        run: |
          mkdir -p app/src/main/res/values
          echo '<resources><string name="default_web_client_id" translatable="false">dummy-client-id</string></resources>' > app/src/main/res/values/dummy_google_services.xml
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-app
          path: app/build/outputs/apk/debug/app-debug.apk
          
